[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stozher-gateway"
version = "0.1.0"
description = "Stozher enforcement mode for Harbormaster — an MCP gateway that classifies, mandates, gates and records every proxied tool call."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PRICEX" }]

# Base dependencies stay as thin as Harbormaster's own two (pyproject.toml:51-54). The kernel is
# reached with urllib.request, following the in-tree precedent (dispatcher_cli.py:154-167), so the
# gateway adds no HTTP client. Ed25519 is optional on purpose: an unconditional crypto import would
# break "a Harbormaster without a kernel loses nothing" for bare installs (ADR-0005).
dependencies = [
    # Upper bound is load-bearing, not caution. `tools.py` imports
    # `mcp.server.fastmcp.tools.base.Tool`, which mcp 2.0 removed; with an open
    # upper bound pip resolves 2.x and the gateway dies at import — a clean
    # build of this project broke the day 2.0.0 was published, while every
    # cached build kept passing. The Rust half builds `--locked` against exactly
    # this failure mode; this is the Python half of that discipline.
    "mcp>=1.2,<2",
    "pydantic>=2.5",
]

[project.optional-dependencies]
# The signing path. Without it the gateway starts, reports the missing extra, and refuses every
# call — it never proceeds unsigned.
crypto = ["cryptography>=42.0"]
dev = [
    "cryptography>=42.0",
    "harbormaster-mcp",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.entry-points."harbormaster.tools"]
stozher-gateway = "stozher_gateway.plugin:register"

[project.scripts]
stozher-gateway = "stozher_gateway.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stozher_gateway"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A reproduction of an open defect is evidence, and evidence that is not executable rots. It stays
# committed and runnable and out of the default run, because a suite that is red for a known reason
# stops being read: the next real regression arrives into a failure everyone has learned to skip.
# Quarantine is not a way of not fixing it — the defect is open either way; it is a way of keeping
# the signal that would tell you it got fixed.
#
#   default run:      python3 -m pytest gateway/tests -q
#   the quarantine:   python3 -m pytest gateway/tests -q -m open_defect
#
# `-m` takes one value and the command line's wins over `addopts`, so the second command runs
# exactly the quarantined tests and nothing else.
markers = [
    "open_defect: a committed, executable reproduction of a defect that is open — expected to fail",
]
addopts = "-m 'not open_defect'"
