[workspace]
resolver = "3"
members = ["stozher-core", "stozher-kernel", "stozher-testkit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/pricex/stozher"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
hmac = "0.13"
ed25519-dalek = "3"
ryu-js = "1"
hex = "0.4"
thiserror = "2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "signal", "sync", "time"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
getrandom = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

# Optimize dependencies in test builds. The 10 000-envelope chain gate performs tens of thousands of
# Ed25519 operations, and an unoptimized `ed25519-dalek` turns a two-second gate into a two-minute
# one. Our own crates stay unoptimized so panics keep useful line numbers.
[profile.test.package."*"]
opt-level = 2

# Arithmetic overflow must trap in the profile that actually ships. Without this the test suite and
# production disagree about what the same line of code does — debug panics, release wraps — so an
# overflow is not merely unfixed but *structurally invisible* to every test we run. For a system
# whose output is an audit claim, a silently wrapped sum is a false claim, and preferring a crash to
# a false claim is the whole posture: an unavailable audit is recoverable, a wrong one is not.
[profile.release]
overflow-checks = true
