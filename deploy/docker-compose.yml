# Two services. ADR-0003 fixes that number, and it is a product constraint rather than a
# minimalism preference: the pitch is a minimal auditable surface, and every additional moving part
# is a line on a security questionnaire and a thing that can be down at 3am.
#
#   kernel   — the event store, ingest, policy distribution, the gate queue and the console, all
#              from one static binary. This is what `docker compose up` starts.
#   gateway  — Harbormaster with enforcement mode. An MCP server spoken over stdio, one process per
#              connecting client, so it is deliberately **not** started by `up`: the MCP client
#              starts it with `docker compose run --rm -T gateway` and it lives as long as the
#              session does. `profiles` is what keeps `up` from starting a process that would have
#              nobody on the other end of its stdin.
#
# No Redis, no separate database server, no reverse proxy, no metrics sidecar. SQLite is the store
# (ADR-0003); Postgres is a documented future seam, not a service here.
#
# Neither service pins `container_name`. A fixed name is global to the docker daemon, so a second
# install on the same host — a re-clone, a staging copy beside a real one — collides with the first
# and the operator gets a container from the *other* checkout answering for this one's config. That
# failure looks like an authentication bug (a token whose digest matches the config on disk still
# refusing), which is a long way from its cause. Compose namespaces by project instead; to run two
# installs side by side, set `COMPOSE_PROJECT_NAME` in each `.env` (it overrides the `name` below).

name: stozher

services:
  kernel:
    image: ${STOZHER_KERNEL_IMAGE:-stozher-kernel:0.1.0}
    build:
      # The repository root: the console's templates are compiled into the binary from `console/`.
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    # The operator's own uid, written by `bin/stozher-bootstrap`. A bind-mounted seed at mode 0600
    # is readable by exactly one account, and the kernel refuses to start on anything more
    # permissive (§09 §8) — so the two sides of the mount have to agree on who that account is.
    #
    # No default. `:-0` would mean that any path reaching `up` with an incomplete `.env` — a hand
    # edit, a CI runner, a restored backup — runs this container as root, quietly, beside a
    # `cap_drop: ALL` and a `no-new-privileges` chosen to prevent exactly that. Not starting is the
    # more honest failure, and the message says what to do about it.
    user: "${STOZHER_UID:?set STOZHER_UID and STOZHER_GID in deploy/.env — run bin/stozher-bootstrap, or add STOZHER_UID=$(id -u) and STOZHER_GID=$(id -g) by hand}:${STOZHER_GID:?set STOZHER_GID in deploy/.env alongside STOZHER_UID}"
    # Loopback by default. `spec/09 §8` requires TLS for component↔kernel traffic; this image
    # terminates none, so exposing the port beyond the host is a decision an operator makes
    # deliberately, with a TLS terminator in front — never a default they inherit.
    ports:
      - "127.0.0.1:${STOZHER_KERNEL_PORT:-8787}:8787"
    # Long syntax, for `create_host_path: false` on every one of them. Docker's default is to
    # *create* a missing bind source, and for a file-shaped mount it creates a **directory**. Under
    # that default a `docker compose up` run before the ceremony left `config/kernel-config.json` as
    # a directory, the kernel logged `config-unreadable: Is a directory (os error 21)`, and
    # `restart: unless-stopped` looped on it for ever; it also created `secrets/` and
    # `secrets/kernel/` at the daemon's 0755 rather than the ceremony's 0700. Refusing to start is
    # the honest failure: nothing here is docker's to invent, every one of these paths is written by
    # `bin/stozher-bootstrap`, and a deployment that has not been bootstrapped should say so rather
    # than half-exist.
    volumes:
      - type: bind
        source: ./var
        target: /var/lib/stozher/data
        bind: { create_host_path: false }
      - type: bind
        source: ./secrets/kernel
        target: /var/lib/stozher/keys
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./config/kernel-config.json
        target: /etc/stozher/kernel-config.json
        read_only: true
        bind: { create_host_path: false }
    environment:
      # Approver-ping credentials, when a channel is configured. Named, never inlined (ADR-0002).
      STOZHER_SLACK_WEBHOOK: "${STOZHER_SLACK_WEBHOOK:-}"
      STOZHER_WEBHOOK_URL: "${STOZHER_WEBHOOK_URL:-}"
      STOZHER_WEBHOOK_TOKEN: "${STOZHER_WEBHOOK_TOKEN:-}"
      STOZHER_SMTP_PASSWORD: "${STOZHER_SMTP_PASSWORD:-}"
    # Defence in depth against the host-root case §09 §8 declines to defend against but insists on
    # making non-silent: nothing here needs to escalate, so nothing here may.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # The kernel writes to exactly two places: the store under /var/lib/stozher/data and SQLite's
    # temporary files. The first is a bind mount and stays writable under a read-only rootfs; the
    # second is why the tmpfs below exists — `VACUUM INTO`, which `bin/stozher-backup` runs against
    # the live kernel, materialises through a temp file. Everything else in the image is the binary
    # and a CA bundle, neither of which is written at runtime. So the rootfs is read-only: a
    # process that cannot write cannot be made to persist anything, and the two paths that must be
    # writable are named rather than inherited.
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=64m
    # Bounded, because unbounded is a choice too. `restart: unless-stopped` in front of a process
    # that can exhaust the host's memory or pids is a loop that takes the host with it, and the
    # default json-file driver grows without limit on a stock Linux daemon — the local daemon's
    # rotation is the local daemon's, not this file's, and shipping a compose file that depends on
    # it is shipping a deployment whose disk usage is somebody else's default.
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    stop_grace_period: 20s

  gateway:
    image: ${STOZHER_GATEWAY_IMAGE:-stozher-gateway:0.1.0}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    profiles: ["mcp"]
    user: "${STOZHER_UID:?set STOZHER_UID and STOZHER_GID in deploy/.env — run bin/stozher-bootstrap, or add STOZHER_UID=$(id -u) and STOZHER_GID=$(id -g) by hand}:${STOZHER_GID:?set STOZHER_GID in deploy/.env alongside STOZHER_UID}"
    depends_on:
      kernel:
        condition: service_healthy
    # Bind mounts, not named volumes. The gateway's local chain is audit state: it belongs beside
    # the store, in the directory `bin/stozher-backup` copies. A named volume would also take its
    # ownership from the image, which is root — and this container runs as the operator.
    #
    # `create_host_path: false` for the same reason as the kernel's: every path here is the
    # ceremony's to write, and an MCP client that starts the gateway against a deployment that was
    # never bootstrapped should fail at the mount rather than be handed an empty directory where its
    # configuration file was supposed to be.
    volumes:
      - type: bind
        source: ./secrets/gateway
        target: /var/lib/stozher/gateway
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./config/stozher-gateway.toml
        target: /etc/stozher/gateway.toml
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ./var/gateway
        target: /var/lib/stozher/state
        bind: { create_host_path: false }
      - type: bind
        source: ./var/notes
        target: /var/lib/stozher/notes
        bind: { create_host_path: false }
    environment:
      # §10 §1.1: one caller per process, authenticated. A multi-caller configuration refuses to
      # start rather than guess whose authority a call is under (ADR-0007).
      STOZHER_GATEWAY_CALLER: "${STOZHER_GATEWAY_CALLER:-claude-code}"
      STOZHER_GATEWAY_CALLER_TOKEN: "${STOZHER_GATEWAY_CALLER_TOKEN:-}"
      STOZHER_GATEWAY_SEED: /var/lib/stozher/gateway/gateway.seed
      STOZHER_KERNEL_TOKEN: "${STOZHER_KERNEL_TOKEN:-}"
      STOZHER_DEMO_NOTES: /var/lib/stozher/notes
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # One process per connecting MCP client, so these bound a *session*, not the deployment. The
    # rootfs is left writable here and not on the kernel: this image carries a Python runtime, which
    # writes bytecode caches inside site-packages, and a read-only rootfs the interpreter works
    # around is a claim rather than a control.
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
